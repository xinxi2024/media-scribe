services:
  - type: web
    name: media-scribe
    runtime: docker
    plan: free
    envVars:
      - key: MEDIA_SCRIBE_BACKEND
        value: groq
      - key: MEDIA_SCRIBE_HOST
        value: 0.0.0.0
      - key: GROQ_API_KEY
        sync: false
      - key: MEDIA_SCRIBE_PASSWORD
        sync: false
